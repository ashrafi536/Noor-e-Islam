name: Build Noor-e-Islam APK

'on':
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Create fresh Android project
    run: |
      rm -rf android
      flutter create --platforms=android --org com --project-name nooreislam .

  - name: Check project files
    run: |
      test -f pubspec.yaml
      test -f lib/main.dart
      test -f android/app/src/main/AndroidManifest.xml

  - name: Get dependencies
    run: flutter pub get

  - name: Analyze project
    run: flutter analyze --no-pub

  - name: Build debug APK
    run: flutter build apk --debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Noor-e-Islam-APK
      path: build/app/outputs/flutter-apk/app-debug.apk
      if-no-files-found: error
      retention-days: 7
