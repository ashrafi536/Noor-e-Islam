name: Build Noor-e-Islam APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.nooreislam --project-name noor_e_islam .

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if p.exists():
              s = p.read_text()
              s = s.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              s = s.replace('jvmTarget = "11"', 'jvmTarget = "17"')
              s = s.replace("jvmTarget = '11'", "jvmTarget = '17'")
              p.write_text(s)
              print("Java/Kotlin target check completed")
          else:
              raise SystemExit("android/app/build.gradle not found")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-e-Islam-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
